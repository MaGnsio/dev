# change default prefix to ctrl + spaceunbind C-Space
set -g prefix C-Space
bind C-Space send-prefix
# mouse usage to enable scrolling, clicking and resizing
set -g mouse on
# numbering windows and panes
set -g base-index 1
setw -g pane-base-index 1
# more intuitive split commands
bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"
# swapping window
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1
# keep current path
bind c new-window -c "#{pane_current_path}"
# remove escape time
set -sg escape-time 0
# turn on focus events
set-option -g focus-events on
# fix colors
set-option -g default-terminal "screen-256color"
set-option -a terminal-features 'xterm-256color:RGB'
# Use vi-style keys in copy mode
setw -g mode-keys vi
# Enable Vim-like pane navigation
bind h select-pane -L  # Move left
bind j select-pane -D  # Move down
bind k select-pane -U  # Move up
bind l select-pane -R  # Move right
# Resize pane using Alt + h/j/k/l
bind -r M-h resize-pane -L  # Shrink pane left
bind -r M-j resize-pane -D  # Shrink pane down
bind -r M-k resize-pane -U  # Shrink pane up
bind -r M-l resize-pane -R  # Shrink pane right
# status position 
set-option -g status-position top
# Theme
set -g @tokyo-night-tmux_theme storm 
set -g @tokyo-night-tmux_show_path 0
set -g @tokyo-night-tmux_show_datetime 0
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "janoamaral/tokyo-night-tmux"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
