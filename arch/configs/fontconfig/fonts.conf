<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

    <!-- 1. Intercept Noto Nastaliq Urdu directly and force Noto Sans Arabic -->
    <match target="pattern">
        <test name="family" qual="any"><string>Noto Nastaliq Urdu</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Noto Sans Arabic</string>
        </edit>
    </match>

    <!-- 2. Re-route standard families to Noto Sans Arabic to step ahead of fallbacks -->
    <match target="pattern">
        <test name="family" qual="any"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans Arabic</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any"><string>serif</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans Arabic</string>
        </edit>
    </match>

    <!-- 3. Scale Noto Sans Arabic globally by 15% -->
    <match target="font">
        <test name="family"><string>Noto Sans Arabic</string></test>
        <edit name="size" mode="assign">
            <times><name>size</name><double>1.15</double></times>
        </edit>
    </match>

</fontconfig>
